[package]
name = "motor"
description = "Motor do Descompacta: decide o que abrir e o que compactar, e conversa com o 7-Zip"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"

[[bin]]
name = "motor-cli"
path = "src/bin/motor-cli.rs"
